<body data-page="contact">
<noscript><p class="demo-notice" style="margin:6rem 1rem 1rem"><span>JavaScript is needed to browse the collection, use the bag and send orders. Please enable it, or contact us at kstiana1@gmail.com.</span></p></noscript>
<main id="main">
  <section class="contact-hero">
    <div class="container">
      <nav aria-label="Breadcrumb"><ol class="breadcrumbs"><li><a href="/">Home</a></li><li><span aria-current="page">Contact</span></li></ol></nav>
      <h1 class="t-display" data-lines data-hero style="margin-top:var(--space-m)"><span data-line>Say hello.</span></h1>
      <p class="t-lead" data-reveal="up" data-hero style="--delay:300ms;margin-top:var(--space-m)">Questions about a product, an order or a length? We would love to hear from you.</p>
    </div>
  </section>
  <section class="container contact-grid">
    <div class="contact-cards" data-contact-cards></div>
    <form class="contact-form" name="contact" method="post" action="/" data-netlify="true" netlify-honeypot="bot-field" novalidate data-contact-form>
      <input type="hidden" name="form-name" value="contact">
      <p class="visually-hidden" aria-hidden="true"><label>Leave this field empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <h2 class="t-heading">Send us a message</h2>
      <div class="contact-form__row">
        <div class="field"><label class="field__label" for="c-name">Your name</label><input class="field__input" id="c-name" name="name" type="text" autocomplete="name" required aria-describedby="c-name-error"><p class="field__error" id="c-name-error" role="alert"></p></div>
        <div class="field"><label class="field__label" for="c-email">Email address</label><input class="field__input" id="c-email" name="email" type="email" inputmode="email" autocomplete="email" required aria-describedby="c-email-error"><p class="field__error" id="c-email-error" role="alert"></p></div>
      </div>
      <div class="field"><label class="field__label" for="c-topic">What is it about?</label>
        <select class="field__select" id="c-topic" name="topic"><option>An order enquiry</option><option>A product question</option><option>Wigs and extensions</option><option>Something else</option></select>
      </div>
      <div class="field"><label class="field__label" for="c-message">Message</label><textarea class="field__textarea" id="c-message" name="message" required aria-describedby="c-message-error" maxlength="1500"></textarea><p class="field__error" id="c-message-error" role="alert"></p></div>
      <label class="check"><input type="checkbox" name="consent" value="yes" required><span>I agree that AURELLE may use these details to reply to me. See the <a class="link" href="/privacy">privacy policy</a>.</span></label>
      <div class="form-status" role="status" data-status hidden></div>
      <button class="btn" type="submit" data-submit style="justify-self:start"><span class="btn__label">Send message</span></button>
    </form>
  </section>
</main>
<div data-footer-root></div>
</body>
